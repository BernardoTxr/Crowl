[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "crowl-api"
version = "0.1.0"
description = "Read-only FastAPI service for Crowl"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "SQLAlchemy==2.0.58",
  "psycopg[binary]==3.3.9",
  "python-dateutil==2.9.0.post0",
  "PyYAML==6.0.3",
  "uvicorn[standard]==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
