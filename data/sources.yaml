    sale_horizon_days: 184
    attribution_required: true
    booking_link_required: false
    booking_hosts: [flixbus.com]
    route_discovery: { method: curated_public_page_coverage, status: verified, provenance: Bounded live canaries on 2026-11-21 completed all six public result pages and returned valid direct round trips for both 2026-11-27 and the six-month endpoint 2027-05-21; the guarded activation then published one 45.96 EUR displayed fare for 2026-11-27. }
